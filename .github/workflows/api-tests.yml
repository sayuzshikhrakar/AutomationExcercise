name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Create .env.chromium file
      run: |
        echo "BROWSER=chromium" >> .env.chromium
        echo "WEB_URL=https://automationexercise.com" >> .env.chromium
        echo "HEADLESS=true" >> .env.chromium
        echo "TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }}" >> .env.chromium
        echo "TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}" >> .env.chromium

    - name: Run API Tests and Generate Report
      run: npm run test:api:report

    - name: Upload API HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: api-html-report
        path: reports/html-report/
        retention-days: 30

    - name: Send Email with Report Status
      uses: dawidd6/action-send-mail@v3
      if: always()
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: API Automation Test Results (${{ job.status }})
        to: sayuzshikhrakar@gmail.com,sayuz6819@gmail.com
        from: ${{ secrets.EMAIL_USERNAME }}
        body: "The API test run has completed with status: ${{ job.status }}. You can download the full HTML report artifact from the GitHub Actions run summary."
