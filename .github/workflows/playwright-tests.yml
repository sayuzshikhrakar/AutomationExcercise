name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      # Only installing chromium to match the test script we are running
      run: npx playwright install --with-deps chromium
      
    - name: Run Playwright tests
      run: npm run test:web:chromium
      
    - name: Generate HTML Report
      if: always() # Ensures the report is generated even if the tests fail
      run: npm run report:chromium
      
    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: reports/html-chromium/ # Adjust this path if your generateReport.js saves it elsewhere
        retention-days: 30
